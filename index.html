<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans CJK SC";
        src: url("assets/fonts/NotoSansCJKsc-Subset.otf") format("opentype");
        font-weight: 400 600;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1a33;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #0b1a33;
        font-family: "Noto Sans CJK SC", sans-serif;
        color: #e8eef7;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
      }
      .scene svg {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        width: 1400px;
        height: 780px;
      }
      .caption-wrap.clip {
        position: absolute;
        inset: auto;
        left: 0;
        right: 0;
        top: auto;
        bottom: 64px;
        width: 1920px;
        height: 170px;
        z-index: 40;
        pointer-events: none;
      }
      .caption {
        left: 50%;
        transform: translateX(-50%);
        max-width: 1400px;
        padding: 18px 36px;
        background: rgba(8, 18, 36, 0.78);
        border: 1.5px solid rgba(94, 200, 232, 0.35);
        border-radius: 10px;
        font-size: 42px;
        line-height: 1.45;
        letter-spacing: 0.04em;
        text-align: center;
        color: #f2f7ff;
        opacity: 0;
        white-space: pre-line;
      }
      .hint {
        position: absolute;
        left: 48px;
        bottom: 48px;
        top: auto;
        right: auto;
        font-size: 22px;
        color: rgba(148, 176, 210, 0.7);
        letter-spacing: 0.06em;
        z-index: 30;
        opacity: 0;
      }
      .end-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        z-index: 50;
        pointer-events: none;
        background: radial-gradient(ellipse at center, #132845 0%, #0b1a33 70%);
      }
      .end-card .big {
        font-size: 72px;
        font-weight: 600;
        color: #f2f7ff;
        letter-spacing: 0.08em;
      }
      .end-card .sub {
        margin-top: 28px;
        font-size: 32px;
        color: #5ec8e8;
        letter-spacing: 0.12em;
      }
      .label-cyan { fill: #5ec8e8; font-family: inherit; }
      .label-warm { fill: #f08a3a; font-family: inherit; }
      .label-soft { fill: #9bb6d4; font-family: inherit; }
      .stroke-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- helpers ----
      const showScene = (id, t, dur) => {
        tl.to("#" + id, { opacity: 1, duration: 0.6, ease: "power2.out" }, t);
        tl.to("#" + id, { opacity: 0, duration: 0.5, ease: "power2.in" }, t + dur - 0.5);
      };
      const showCap = (id, t, dur) => {
        tl.fromTo("#" + id, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45 }, t + 0.2);
        tl.to("#" + id, { autoAlpha: 0, duration: 0.35 }, t + dur - 0.45);

      // Scene visibility windows

      showScene("scene2", 10, 15);
      showScene("scene3", 25, 17);
      showScene("scene4", 42, 16);
      showScene("scene5", 58, 17);

      tl.to("#scene6", { opacity: 0, duration: 0.6 }, 84.2);

      showCap("cap1", 0, 10);
      showCap("cap2", 10, 15);
      showCap("cap3", 25, 17);
      showCap("cap4", 42, 16);
      showCap("cap5", 58, 17);
      showCap("cap6", 75, 9);

      // ---- Scene 1: Big Bang ----
      tl.fromTo("#s1-core", { attr: { r: 2 }, opacity: 0 }, { attr: { r: 90 }, opacity: 1, duration: 2.2, ease: "power2.out" }, 0.3);
      tl.fromTo("#s1-ring", { attr: { r: 8 }, opacity: 0.9 }, { attr: { r: 260 }, opacity: 0, duration: 3.5, ease: "power1.out" }, 0.8);
      tl.to("#s1-foam", { opacity: 1, duration: 1.8 }, 2.2);
      tl.fromTo("#s1-foam", { scale: 0.55, transformOrigin: "700px 390px" }, { scale: 1.05, duration: 5, ease: "power1.out" }, 2.2);
      tl.to("#hint1", { opacity: 1, duration: 0.5 }, 1.5);
      tl.to("#hint1", { opacity: 0, duration: 0.4 }, 9.2);

      // ---- Scene 2: H / He ----
      tl.fromTo("#s2-parts", { opacity: 1 }, { opacity: 0, duration: 1.2 }, 14);
      tl.to("#s2-h", { opacity: 1, duration: 0.8 }, 14.2);
      tl.to("#s2-he", { opacity: 1, duration: 0.8 }, 15.0);
      tl.to("#s2-note", { opacity: 1, duration: 0.6 }, 15.5);
      tl.fromTo("#s2-p1", { x: -40 }, { x: 40, duration: 4, ease: "sine.inOut" }, 10.2);
      tl.fromTo("#s2-p2", { x: 30 }, { x: -20, duration: 4, ease: "sine.inOut" }, 10.2);
      tl.fromTo("#s2-p3", { y: -20 }, { y: 30, duration: 4, ease: "sine.inOut" }, 10.4);
      tl.fromTo("#s2-p4", { y: 25 }, { y: -15, duration: 4, ease: "sine.inOut" }, 10.4);

      // ---- Scene 3: stellar furnace ----

      tl.to("#s3-step1", { opacity: 1, duration: 0.4 }, 27);
      // arrows via sibling polygons - set individually
      tl.to("#s3-a1", { opacity: 1, duration: 0.25 }, 28);
      tl.set("#s3-chain polygon", { opacity: 1 }, 28.1);
      tl.to("#s3-step2", { opacity: 1, duration: 0.4 }, 29);
      tl.to("#s3-a2", { opacity: 1, duration: 0.25 }, 30.2);
      tl.to("#s3-step3", { opacity: 1, duration: 0.4 }, 31.2);
      tl.to("#s3-a3", { opacity: 1, duration: 0.25 }, 32.5);

      // ---- Scene 4: supernova ----

      tl.fromTo("#s4-core", { attr: { r: 35 } }, { attr: { r: 12 }, duration: 2.5, ease: "power2.in" }, 42.5);
      tl.to("#s4-burst", { opacity: 1, duration: 0.25 }, 45.2);
      tl.fromTo("#s4-burst", { scale: 0.3, transformOrigin: "700px 390px" }, { scale: 1.4, duration: 1.8, ease: "power2.out" }, 45.2);
